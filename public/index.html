<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSA Nexus — Learn Data Structures & Algorithms</title>
<meta name="description" content="Learn Data Structures & Algorithms from basic to advanced, with visual diagrams and a live JavaScript compiler." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script>
  // Applied synchronously, before first paint, to avoid a flash of the wrong theme.
  try {
    var t = localStorage.getItem("dsa-nexus:theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* localStorage unavailable — default dark stays */ }
</script>
</head>
<body>
<div class="bubble-field"><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span></div>
<div class="toast-container" id="toastContainer"></div>

<header class="topbar">
  <button class="hamburger" id="hamburger" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
  <a href="#/" class="brand">
    <span class="brand-mark">&lt;/&gt;</span>
    <span class="brand-name">DSA <em>Nexus</em></span>
  </a>
  <div class="search-wrap">
    <input id="searchInput" type="text" placeholder="Search topics… e.g. binary search, heap, DP" autocomplete="off" />
    <div id="searchResults" class="search-results hidden"></div>
  </div>
  <a href="#/bookmarks" class="topbar-link" id="bookmarksLink" title="Saved topics">★ Saved</a>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cycle theme: dark, aurora, light" title="Cycle theme">
    <span class="theme-icon-dark">🌙</span>
    <span class="theme-icon-aurora">🫧</span>
    <span class="theme-icon-light">☀️</span>
  </button>
  <div id="xpChipHost"><!-- populated by app.js --></div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-scroll">
      <div class="sidebar-primary-nav">
        <a href="#/" class="spn-link">🏠 Home</a>
        <a href="#/problems" class="spn-link">🧩 Problems</a>
        <a href="#/terminal" class="spn-link">⌨️ Terminal</a>
        <a href="#/dashboard" class="spn-link">📊 Dashboard</a>
        <a href="/games" class="spn-link">🎮 Take a Break</a>
        <a href="#/feedback" class="spn-link">💬 Feedback</a>
      </div>
      <div class="sidebar-divider"></div>
      <div id="sidebarContent">
        <!-- populated by app.js -->
      </div>
      <div id="sidebarTipHost"></div>
    </div>
  </nav>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="content" id="content">
    <!-- populated by app.js -->
  </main>
</div>

<footer class="site-footer">
  <p>DSA Nexus — built with Node.js, Express, HTML, CSS &amp; vanilla JS. Diagrams are original SVGs, not sourced from third parties.</p>
</footer>

<!-- Scroll progress bar -->
<div id="scrollProgress"></div>

<!-- Confetti canvas -->
<canvas id="confettiCanvas"></canvas>

<!-- Scroll-to-top button -->
<button id="scrollToTopBtn" aria-label="Scroll to top" title="Back to top">↑</button>

<!-- Command Palette (Ctrl+K) -->
<div id="cmdPalette" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="cmd-box">
    <div class="cmd-input-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="cmdInput" type="text" placeholder="Search topics, patterns, problems…" autocomplete="off" />
      <span class="cmd-esc-badge">ESC</span>
    </div>
    <div class="cmd-results" id="cmdResults"></div>
    <div class="cmd-footer">
      <span><kbd>↑↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>ESC</kbd> close</span>
    </div>
  </div>
</div>

<script src="/js/progress.js"></script>
<script src="/js/xp.js"></script>
<script src="/js/highlight.js"></script>
<script src="/js/background.js"></script>
<script src="/js/diagrams.js"></script>
<script src="/js/compiler.js"></script>
<script src="/js/terminal.js"></script>
<script src="/js/slides.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/app.js?v=2"></script>
</body>
</html>
