<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSA Nexus — Rock Paper Scissors</title>
<meta name="description" content="Take a break with Rock Paper Scissors." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
  .game-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; z-index: 10; max-width: 800px; margin: 0 auto; width: 100%; }
  .game-header { text-align: center; margin-bottom: 30px; }
  .game-header h1 { font-family: var(--font-display); font-size: 2.5rem; margin: 0; }
  .game-header p { color: var(--text-muted); font-size: 1.1rem; margin-top: 8px; }
  
  .game-dashboard { display: flex; gap: 40px; margin-bottom: 40px; background: var(--surface); padding: 20px 40px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .score-card { text-align: center; }
  .score-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .score-value { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; color: var(--text); }
  .score-value.player { color: var(--accent-2); }
  .score-value.ai { color: var(--danger); }

  .arena { display: flex; align-items: center; justify-content: space-around; width: 100%; margin-bottom: 40px; }
  .fighter { display: flex; flex-direction: column; align-items: center; }
  .fighter-label { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; color: var(--text-muted); }
  .fighter-emoji { font-size: 5rem; background: var(--surface-2); border: 1px solid var(--border-strong); width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: transform 0.3s; }
  .fighter-emoji.animate { transform: translateY(-20px) scale(1.1); }
  
  .vs { font-family: var(--font-display); font-size: 2rem; color: var(--text-faint); font-weight: 700; font-style: italic; }
  
  .controls-label { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; text-align: center; }
  .choices { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
  .choice-btn { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 15px 25px; font-size: 2rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  .choice-btn:hover { background: var(--surface-3); transform: translateY(-5px); border-color: var(--accent-2); }
  
  .game-message { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; min-height: 40px; text-align: center; margin-bottom: 20px; }
  .game-message.win { color: var(--accent-2); }
  .game-message.lose { color: var(--danger); }
  .game-message.draw { color: var(--accent); }

  .standalone-nav { position: absolute; top: 20px; left: 20px; z-index: 100; }
  .reset-btn { margin-top: 10px; }
</style>
<script>
  try {
    var t = localStorage.getItem("dsa-nexus:theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { }
</script>
</head>
<body>
<div class="bubble-field"><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span></div>

<div class="standalone-nav">
  <a href="/games" class="btn btn-ghost">← Back to Hub</a>
</div>

<main class="game-container">
  <div class="game-header">
    <h1>Rock Paper <span class="accent">Scissors</span></h1>
    <p>Beat the AI or a friend locally.</p>
  </div>

  <div class="game-dashboard">
    <div class="score-card">
      <div class="score-label" id="label-player">You</div>
      <div class="score-value player" id="score-player">0</div>
    </div>
    <div class="score-card">
      <div class="score-label">Draws</div>
      <div class="score-value" id="score-draw">0</div>
    </div>
    <div class="score-card">
      <div class="score-label" id="label-ai">AI</div>
      <div class="score-value ai" id="score-ai">0</div>
    </div>
  </div>

  <div class="arena">
    <div class="fighter">
      <div class="fighter-label" id="fighter-label-p1">You</div>
      <div class="fighter-emoji" id="player-emoji">❓</div>
    </div>
    <div class="vs">VS</div>
    <div class="fighter">
      <div class="fighter-label" id="fighter-label-ai">AI</div>
      <div class="fighter-emoji" id="ai-emoji">❓</div>
    </div>
  </div>

  <div class="game-message" id="message">Choose your weapon!</div>

  <div class="controls-label">Make your move:</div>
  <div class="choices">
    <button class="choice-btn" data-choice="rock">✊</button>
    <button class="choice-btn" data-choice="paper">✋</button>
    <button class="choice-btn" data-choice="scissors">✌️</button>
  </div>

  <div style="display: flex; gap: 10px; justify-content: center;">
    <button class="btn btn-ghost reset-btn" id="btn-toggle-mode" style="border-color: var(--accent-2); color: var(--accent-2);">1 Player (vs AI)</button>
    <button class="btn btn-ghost reset-btn" id="btn-reset">Reset Scores</button>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const scorePlayerEl = document.getElementById('score-player');
  const scoreAiEl = document.getElementById('score-ai');
  const scoreDrawEl = document.getElementById('score-draw');
  const playerEmojiEl = document.getElementById('player-emoji');
  const aiEmojiEl = document.getElementById('ai-emoji');
  const messageEl = document.getElementById('message');
  const choiceBtns = document.querySelectorAll('.choice-btn');
  const btnToggleMode = document.getElementById('btn-toggle-mode');
  const labelPlayer = document.getElementById('label-player');
  const labelAi = document.getElementById('label-ai');
  const fighterLabelP1 = document.getElementById('fighter-label-p1');
  const fighterLabelAi = document.getElementById('fighter-label-ai');
  
  const emojis = { 'rock': '✊', 'paper': '✋', 'scissors': '✌️' };
  const choices = ['rock', 'paper', 'scissors'];
  
  let isTwoPlayer = false;
  let p1Choice = null;
  let isAnimating = false;
  
  let scores = { player: 0, ai: 0, draw: 0 };
  let scores2P = { p1: 0, p2: 0, draw: 0 };
  try {
    const saved = localStorage.getItem('dsa-nexus:rps-scores');
    if (saved) scores = JSON.parse(saved);
    const saved2P = localStorage.getItem('dsa-nexus:rps-scores-2p');
    if (saved2P) scores2P = JSON.parse(saved2P);
  } catch(e) {}
  
  function updateScoreUI() {
    if (isTwoPlayer) {
      scorePlayerEl.textContent = scores2P.p1;
      scoreAiEl.textContent = scores2P.p2;
      scoreDrawEl.textContent = scores2P.draw;
      labelPlayer.textContent = 'Player 1';
      labelAi.textContent = 'Player 2';
      fighterLabelP1.textContent = 'Player 1';
      fighterLabelAi.textContent = 'Player 2';
      btnToggleMode.textContent = '2 Players (Local)';
    } else {
      scorePlayerEl.textContent = scores.player;
      scoreAiEl.textContent = scores.ai;
      scoreDrawEl.textContent = scores.draw;
      labelPlayer.textContent = 'You';
      labelAi.textContent = 'AI';
      fighterLabelP1.textContent = 'You';
      fighterLabelAi.textContent = 'AI';
      btnToggleMode.textContent = '1 Player (vs AI)';
    }
  }
  updateScoreUI();

  function saveScores() {
    try {
      localStorage.setItem('dsa-nexus:rps-scores', JSON.stringify(scores));
      localStorage.setItem('dsa-nexus:rps-scores-2p', JSON.stringify(scores2P));
    } catch(e) {}
  }

  function getWinner(player, opponent) {
    if (player === opponent) return 'draw';
    if (
      (player === 'rock' && opponent === 'scissors') ||
      (player === 'paper' && opponent === 'rock') ||
      (player === 'scissors' && opponent === 'paper')
    ) return 'player';
    return 'ai';
  }

  function resetRound() {
    p1Choice = null;
    playerEmojiEl.textContent = '❓';
    aiEmojiEl.textContent = '❓';
    playerEmojiEl.classList.remove('animate');
    aiEmojiEl.classList.remove('animate');
    messageEl.textContent = isTwoPlayer ? 'Player 1, choose your weapon!' : 'Choose your weapon!';
    messageEl.className = 'game-message';
    isAnimating = false;
  }

  choiceBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if (isAnimating) return;
      
      const choice = btn.getAttribute('data-choice');
      
      if (isTwoPlayer) {
        if (!p1Choice) {
          // P1 made their choice
          p1Choice = choice;
          playerEmojiEl.textContent = '🔒';
          messageEl.textContent = 'Player 2, choose your weapon!';
          messageEl.className = 'game-message';
        } else {
          // P2 made their choice, resolve game
          isAnimating = true;
          playerEmojiEl.classList.remove('animate');
          aiEmojiEl.classList.remove('animate');
          
          playerEmojiEl.textContent = '✊';
          aiEmojiEl.textContent = '✊';
          messageEl.textContent = 'Shoot!';
          
          setTimeout(() => {
            playerEmojiEl.textContent = emojis[p1Choice];
            aiEmojiEl.textContent = emojis[choice];
            playerEmojiEl.classList.add('animate');
            aiEmojiEl.classList.add('animate');
            
            const winner = getWinner(p1Choice, choice);
            if (winner === 'player') {
              scores2P.p1++;
              messageEl.textContent = 'Player 1 Wins! 🎉';
              messageEl.className = 'game-message win';
            } else if (winner === 'ai') {
              scores2P.p2++;
              messageEl.textContent = 'Player 2 Wins! 🤖';
              messageEl.className = 'game-message lose';
            } else {
              scores2P.draw++;
              messageEl.textContent = 'Draw! 🤝';
              messageEl.className = 'game-message draw';
            }
            
            updateScoreUI();
            saveScores();
            
            setTimeout(resetRound, 2000);
          }, 400);
        }
      } else {
        // 1 Player vs AI
        isAnimating = true;
        const aiChoice = choices[Math.floor(Math.random() * choices.length)];
        
        playerEmojiEl.classList.remove('animate');
        aiEmojiEl.classList.remove('animate');
        
        playerEmojiEl.textContent = '✊';
        aiEmojiEl.textContent = '✊';
        messageEl.textContent = 'Shoot!';
        
        setTimeout(() => {
          playerEmojiEl.textContent = emojis[choice];
          aiEmojiEl.textContent = emojis[aiChoice];
          playerEmojiEl.classList.add('animate');
          aiEmojiEl.classList.add('animate');
          
          const winner = getWinner(choice, aiChoice);
          if (winner === 'player') {
            scores.player++;
            messageEl.textContent = 'You Win! 🎉';
            messageEl.className = 'game-message win';
          } else if (winner === 'ai') {
            scores.ai++;
            messageEl.textContent = 'AI Wins! 🤖';
            messageEl.className = 'game-message lose';
          } else {
            scores.draw++;
            messageEl.textContent = 'Draw! 🤝';
            messageEl.className = 'game-message draw';
          }
          
          updateScoreUI();
          saveScores();
          
          setTimeout(resetRound, 2000);
        }, 400);
      }
    });
  });

  btnToggleMode.addEventListener('click', () => {
    isTwoPlayer = !isTwoPlayer;
    updateScoreUI();
    resetRound();
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    if (isTwoPlayer) {
      scores2P = { p1: 0, p2: 0, draw: 0 };
    } else {
      scores = { player: 0, ai: 0, draw: 0 };
    }
    saveScores();
    updateScoreUI();
    resetRound();
  });
});
</script>
</body>
</html>
