<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSA Nexus — Tic-Tac-Toe</title>
<meta name="description" content="Take a break with an algorithm-powered Tic-Tac-Toe game." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .game-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    z-index: 10;
  }
  .game-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .game-header h1 {
    font-family: var(--font-display);
    font-size: 2.5rem;
    margin: 0;
  }
  .game-header h1 .accent {
    color: var(--accent);
  }
  .game-header p {
    color: var(--text-muted);
    font-size: 1.1rem;
    margin-top: 8px;
  }
  
  .game-dashboard {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    background: var(--surface);
    padding: 15px 30px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .score-card {
    text-align: center;
  }
  .score-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .score-value {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text);
  }
  .score-value.player { color: var(--accent-2); }
  .score-value.ai { color: var(--danger); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 12px;
    background: var(--surface-2);
    padding: 16px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-strong);
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .cell {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 3.5rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .cell:hover {
    background: var(--surface-3);
    transform: scale(1.05);
    border-color: var(--accent-soft);
  }
  .cell.x {
    color: var(--accent-2);
    text-shadow: 0 0 15px var(--accent-2-soft);
  }
  .cell.o {
    color: var(--danger);
    text-shadow: 0 0 15px var(--danger-soft);
  }
  .cell.taken {
    cursor: not-allowed;
  }
  
  .game-controls {
    margin-top: 40px;
    display: flex;
    gap: 16px;
  }
  .game-message {
    margin-top: 20px;
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 600;
    min-height: 36px;
    text-align: center;
  }
  .game-message.win { color: var(--accent-2); }
  .game-message.lose { color: var(--danger); }
  .game-message.draw { color: var(--accent); }

  /* Navigation override for standalone page */
  .standalone-nav {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 100;
  }
  
  @media (max-width: 500px) {
    .board {
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 8px;
    }
    .cell { font-size: 2.5rem; }
  }
</style>
<script>
  try {
    var t = localStorage.getItem("dsa-nexus:theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) { }
</script>
</head>
<body>
<div class="bubble-field"><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span><span class="bubble"></span></div>

<div class="standalone-nav">
  <a href="/app" class="btn btn-ghost">
    ← Back to Learning
  </a>
</div>

<main class="game-container">
  <div class="game-header">
    <h1>Tic-Tac-<span class="accent">Toe</span></h1>
    <p>Play against the AI or a friend locally.</p>
  </div>

  <div class="game-dashboard">
    <div class="score-card">
      <div class="score-label" id="label-x">You (X)</div>
      <div class="score-value player" id="score-player">0</div>
    </div>
    <div class="score-card">
      <div class="score-label">Draws</div>
      <div class="score-value" id="score-draw">0</div>
    </div>
    <div class="score-card">
      <div class="score-label" id="label-o">AI (O)</div>
      <div class="score-value ai" id="score-ai">0</div>
    </div>
  </div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div class="game-message" id="message">Your turn!</div>

  <div class="game-controls" style="flex-wrap: wrap; justify-content: center;">
    <button class="btn btn-ghost" id="btn-toggle-mode" style="border-color: var(--accent-2); color: var(--accent-2);">1 Player (vs AI)</button>
    <button class="btn btn-primary" id="btn-restart">Restart Game</button>
    <button class="btn btn-ghost" id="btn-reset-scores">Reset Scores</button>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = document.querySelectorAll('.cell');
  const messageEl = document.getElementById('message');
  const scorePlayerEl = document.getElementById('score-player');
  const scoreAiEl = document.getElementById('score-ai');
  const scoreDrawEl = document.getElementById('score-draw');
  const labelX = document.getElementById('label-x');
  const labelO = document.getElementById('label-o');
  const btnToggleMode = document.getElementById('btn-toggle-mode');
  
  let board = Array(9).fill(null);
  let gameActive = true;
  let isTwoPlayer = false;
  let currentPlayer = 'X'; // Used in 2-player mode
  
  // Load scores
  let scores = { player: 0, ai: 0, draw: 0 };
  let scores2P = { x: 0, o: 0, draw: 0 };
  
  try {
    const saved = localStorage.getItem('dsa-nexus:tictactoe-scores');
    if (saved) scores = JSON.parse(saved);
    const saved2P = localStorage.getItem('dsa-nexus:tictactoe-scores-2p');
    if (saved2P) scores2P = JSON.parse(saved2P);
  } catch(e) {}
  
  function updateScoreUI() {
    if (isTwoPlayer) {
      scorePlayerEl.textContent = scores2P.x;
      scoreAiEl.textContent = scores2P.o;
      scoreDrawEl.textContent = scores2P.draw;
      labelX.textContent = 'Player 1 (X)';
      labelO.textContent = 'Player 2 (O)';
      btnToggleMode.textContent = '2 Players (Local)';
    } else {
      scorePlayerEl.textContent = scores.player;
      scoreAiEl.textContent = scores.ai;
      scoreDrawEl.textContent = scores.draw;
      labelX.textContent = 'You (X)';
      labelO.textContent = 'AI (O)';
      btnToggleMode.textContent = '1 Player (vs AI)';
    }
  }
  updateScoreUI();

  function saveScores() {
    try {
      localStorage.setItem('dsa-nexus:tictactoe-scores', JSON.stringify(scores));
      localStorage.setItem('dsa-nexus:tictactoe-scores-2p', JSON.stringify(scores2P));
    } catch(e) {}
  }

  const winPatterns = [
    [0,1,2], [3,4,5], [6,7,8], // rows
    [0,3,6], [1,4,7], [2,5,8], // cols
    [0,4,8], [2,4,6]           // diags
  ];

  function checkWinner(state) {
    for (let pattern of winPatterns) {
      const [a, b, c] = pattern;
      if (state[a] && state[a] === state[b] && state[a] === state[c]) {
        return state[a];
      }
    }
    if (!state.includes(null)) return 'draw';
    return null;
  }

  // Minimax Algorithm
  function minimax(state, depth, isMaximizing) {
    const result = checkWinner(state);
    if (result === 'O') return 10 - depth;
    if (result === 'X') return depth - 10;
    if (result === 'draw') return 0;

    if (isMaximizing) {
      let bestScore = -Infinity;
      for (let i = 0; i < 9; i++) {
        if (state[i] === null) {
          state[i] = 'O';
          let score = minimax(state, depth + 1, false);
          state[i] = null;
          bestScore = Math.max(score, bestScore);
        }
      }
      return bestScore;
    } else {
      let bestScore = Infinity;
      for (let i = 0; i < 9; i++) {
        if (state[i] === null) {
          state[i] = 'X';
          let score = minimax(state, depth + 1, true);
          state[i] = null;
          bestScore = Math.min(score, bestScore);
        }
      }
      return bestScore;
    }
  }

  function bestMove() {
    let bestScore = -Infinity;
    let move;
    
    // Slight randomization on first move to make it less repetitive if AI goes first
    const available = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
    if (available.length === 9) {
      const corners = [0, 2, 6, 8];
      return corners[Math.floor(Math.random() * corners.length)];
    }

    for (let i = 0; i < 9; i++) {
      if (board[i] === null) {
        board[i] = 'O';
        let score = minimax(board, 0, false);
        board[i] = null;
        if (score > bestScore) {
          bestScore = score;
          move = i;
        }
      }
    }
    return move;
  }

  function render() {
    cells.forEach((cell, index) => {
      cell.textContent = board[index] || '';
      cell.className = 'cell';
      if (board[index]) {
        cell.classList.add(board[index].toLowerCase(), 'taken');
      }
    });
  }

  function handleResult(result) {
    gameActive = false;
    if (isTwoPlayer) {
      if (result === 'X') {
        scores2P.x++;
        messageEl.textContent = 'Player 1 (X) wins!';
        messageEl.className = 'game-message win';
      } else if (result === 'O') {
        scores2P.o++;
        messageEl.textContent = 'Player 2 (O) wins!';
        messageEl.className = 'game-message lose';
      } else {
        scores2P.draw++;
        messageEl.textContent = "It's a draw!";
        messageEl.className = 'game-message draw';
      }
    } else {
      if (result === 'X') {
        scores.player++;
        messageEl.textContent = 'You win!';
        messageEl.className = 'game-message win';
      } else if (result === 'O') {
        scores.ai++;
        messageEl.textContent = 'AI wins!';
        messageEl.className = 'game-message lose';
      } else {
        scores.draw++;
        messageEl.textContent = "It's a draw!";
        messageEl.className = 'game-message draw';
      }
    }
    saveScores();
    updateScoreUI();
  }

  function aiTurn() {
    if (!gameActive || isTwoPlayer) return;
    const move = bestMove();
    if (move !== undefined) {
      board[move] = 'O';
      render();
      const result = checkWinner(board);
      if (result) {
        handleResult(result);
      } else {
        messageEl.textContent = 'Your turn!';
      }
    }
  }

  cells.forEach(cell => {
    cell.addEventListener('click', () => {
      const idx = parseInt(cell.getAttribute('data-index'));
      if (!gameActive || board[idx] !== null) return;
      
      if (isTwoPlayer) {
        board[idx] = currentPlayer;
        render();
        const result = checkWinner(board);
        if (result) {
          handleResult(result);
        } else {
          currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
          messageEl.textContent = `Player ${currentPlayer === 'X' ? '1 (X)' : '2 (O)'}'s turn!`;
        }
      } else {
        board[idx] = 'X';
        render();
        
        const result = checkWinner(board);
        if (result) {
          handleResult(result);
        } else {
          messageEl.textContent = 'AI is thinking...';
          setTimeout(aiTurn, 400);
        }
      }
    });
  });

  function restartGame() {
    board = Array(9).fill(null);
    gameActive = true;
    currentPlayer = 'X';
    messageEl.textContent = isTwoPlayer ? "Player 1 (X)'s turn!" : 'Your turn!';
    messageEl.className = 'game-message';
    render();
  }

  document.getElementById('btn-restart').addEventListener('click', restartGame);

  document.getElementById('btn-reset-scores').addEventListener('click', () => {
    if (isTwoPlayer) {
      scores2P = { x: 0, o: 0, draw: 0 };
    } else {
      scores = { player: 0, ai: 0, draw: 0 };
    }
    saveScores();
    updateScoreUI();
  });

  btnToggleMode.addEventListener('click', () => {
    isTwoPlayer = !isTwoPlayer;
    updateScoreUI();
    restartGame();
  });
});
</script>
</body>
</html>
